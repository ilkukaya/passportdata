name: Weekly visa data update

# Netlify is connected to this repository and rebuilds the site automatically on every push
# to the production branch, so this workflow only needs to refresh the data and commit it.
on:
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC
  workflow_dispatch:
    inputs:
      indexnow:
        description: 'Also notify IndexNow (Bing, Yandex…) about all URLs'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download latest open visa dataset
        run: node scripts/update-data.mjs

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/
          if git diff --staged --quiet; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): visa data update $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify IndexNow after Netlify has deployed
        if: steps.commit.outputs.changed == 'true' || inputs.indexnow
        run: |
          if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then sleep 900; fi  # wait for the Netlify build
          node scripts/indexnow.mjs
